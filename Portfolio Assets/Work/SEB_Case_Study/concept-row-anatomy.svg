<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" role="img" aria-label="The transaction row, before and after. Today: a reference number is the biggest text even when it's just a code, the category is the smallest text, the account balance is shown on every row, and the icon comes from a category that can be inaccurate. Concept: the shop name and category are the clearest things and stay the same size, the category can be changed in one tap, the account balance is not shown in search results, and a plain icon is used when the category isn't certain.">
  <defs>
    <style>
      text{font-family:-apple-system,'SF Pro Text','Segoe UI','Inter',system-ui,sans-serif;fill:#FFFFFF}
      .sec{fill:#A6A6A8}
      .plabel{fill:#8A8A8C;font-size:12.5px;letter-spacing:1.4px}
      .noteh{fill:#FFFFFF;font-size:13.5px;font-weight:600}
      .note{fill:#B9B9C0;font-size:13px}
      .num{fill:#0A0A0A;font-size:10px;font-weight:700;dominant-baseline:central}
    </style>
  </defs>

  <rect width="800" height="760" fill="#151517"/>

  <!-- ============ BEFORE ============ -->
  <text x="40" y="40" class="plabel">SEB TODAY</text>

  <rect x="40" y="54" width="720" height="108" rx="14" fill="#0A0A0A" stroke="#38383A" stroke-width="1"/>

  <!-- icon: fork & knife (from a misclassified "Restaurant" category) -->
  <circle cx="96" cy="108" r="24" fill="#403358"/>
  <line x1="90" y1="96" x2="90" y2="120" stroke="#BDA8FA" stroke-width="2" stroke-linecap="round"/>
  <path d="M85 96v7a5 5 0 0010 0v-7" fill="none" stroke="#BDA8FA" stroke-width="2" stroke-linecap="round"/>
  <path d="M104 96c-3 1-4 6-4 10s2 4 4 4 0 8 0 10" fill="none" stroke="#BDA8FA" stroke-width="2" stroke-linecap="round"/>

  <text x="140" y="88" class="sec" font-size="13">1 Sep</text>
  <text x="140" y="112" font-size="19" font-weight="700">Anthropic</text>
  <text x="140" y="134" class="sec" font-size="12.5">Restaurant</text>
  <text x="612" y="106" font-size="19" font-weight="700" text-anchor="end">−255,04</text>
  <text x="612" y="130" class="sec" font-size="12.5" text-anchor="end">1 563,24</text>
  <path d="M700 100l8 8-8 8" fill="none" stroke="#7C7C80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- markers: r=8, each one tight beside the element it labels -->
  <g>
    <circle cx="245" cy="105.5" r="8" fill="#D98A8A"/><text x="245" y="105.5" class="num" text-anchor="middle">1</text>
    <circle cx="219" cy="129.5" r="8" fill="#D98A8A"/><text x="219" y="129.5" class="num" text-anchor="middle">2</text>
    <circle cx="627" cy="125.5" r="8" fill="#D98A8A"/><text x="627" y="125.5" class="num" text-anchor="middle">3</text>
    <circle cx="96" cy="142" r="8" fill="#D98A8A"/><text x="96" y="142" class="num" text-anchor="middle">4</text>
  </g>

  <!-- before notes 2x2 -->
  <g>
    <circle cx="49" cy="187" r="8" fill="#D98A8A"/><text x="49" y="187" class="num" text-anchor="middle">1</text>
    <text x="66" y="192" class="noteh">Merchant / reference is the largest element</text>
    <text x="66" y="211" class="note">— even when it is a raw phone number or code.</text>

    <circle cx="415" cy="187" r="8" fill="#D98A8A"/><text x="415" y="187" class="num" text-anchor="middle">2</text>
    <text x="432" y="192" class="noteh">Category is the smallest, greyest text</text>
    <text x="432" y="211" class="note">— the one attribute worth scanning by is buried.</text>

    <circle cx="49" cy="237" r="8" fill="#D98A8A"/><text x="49" y="237" class="num" text-anchor="middle">3</text>
    <text x="66" y="242" class="noteh">Running balance repeats on every row</text>
    <text x="66" y="261" class="note">— rarely the answer in a search or filtered list.</text>

    <circle cx="415" cy="237" r="8" fill="#D98A8A"/><text x="415" y="237" class="num" text-anchor="middle">4</text>
    <text x="432" y="242" class="noteh">The icon is generated from the category</text>
    <text x="432" y="261" class="note">— so a misclassified one shows a misleading icon.</text>
  </g>

  <line x1="40" y1="312" x2="760" y2="312" stroke="#38383A" stroke-width="1"/>

  <!-- ============ AFTER ============ -->
  <text x="40" y="356" class="plabel">CONCEPT — NOT SHIPPED SEB WORK</text>

  <rect x="40" y="370" width="720" height="108" rx="14" fill="#0A0A0A" stroke="#38383A" stroke-width="1"/>

  <!-- icon: card / subscription -->
  <circle cx="96" cy="424" r="24" fill="#403358"/>
  <rect x="82" y="414" width="28" height="20" rx="3" fill="none" stroke="#BDA8FA" stroke-width="2"/>
  <line x1="82" y1="421" x2="110" y2="421" stroke="#BDA8FA" stroke-width="2"/>

  <text x="140" y="404" class="sec" font-size="13">1 Sep</text>
  <text x="140" y="428" font-size="17" font-weight="600">Anthropic</text>
  <text x="140" y="450" class="sec" font-size="12.5">Software &amp; subscriptions</text>
  <g transform="translate(352,441)"><rect x="0" y="0" width="46" height="15" rx="7.5" fill="#33333A"/><text x="23" y="8" font-size="9.5" class="sec" text-anchor="middle" dominant-baseline="central">EDITED</text></g>
  <text x="612" y="430" font-size="17" font-weight="600" text-anchor="end">−255,04</text>
  <path d="M700 416l8 8-8 8" fill="none" stroke="#7C7C80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <circle cx="233" cy="421.5" r="8" fill="#8BDB59"/><text x="233" y="421.5" class="num" text-anchor="middle">1</text>
    <circle cx="302" cy="445.5" r="8" fill="#8BDB59"/><text x="302" y="445.5" class="num" text-anchor="middle">2</text>
    <circle cx="627" cy="423.5" r="8" fill="#8BDB59"/><text x="627" y="423.5" class="num" text-anchor="middle">3</text>
    <circle cx="96" cy="458" r="8" fill="#8BDB59"/><text x="96" y="458" class="num" text-anchor="middle">4</text>
  </g>

  <!-- after notes 2x2 -->
  <g>
    <circle cx="49" cy="507" r="8" fill="#8BDB59"/><text x="49" y="507" class="num" text-anchor="middle">1</text>
    <text x="66" y="512" class="noteh">Merchant + a meaningful category lead</text>
    <text x="66" y="531" class="note">— and stay the same size and weight as today.</text>

    <circle cx="415" cy="507" r="8" fill="#8BDB59"/><text x="415" y="507" class="num" text-anchor="middle">2</text>
    <text x="432" y="512" class="noteh">Categories are correctable in one tap</text>
    <text x="432" y="531" class="note">— from the detail view, optionally saved as a rule.</text>

    <circle cx="49" cy="557" r="8" fill="#8BDB59"/><text x="49" y="557" class="num" text-anchor="middle">3</text>
    <text x="66" y="562" class="noteh">Running balance removed from search</text>
    <text x="66" y="581" class="note">— and filtered views, where it isn’t the answer.</text>

    <circle cx="415" cy="557" r="8" fill="#8BDB59"/><text x="415" y="557" class="num" text-anchor="middle">4</text>
    <text x="432" y="562" class="noteh">Neutral icon when confidence is low</text>
    <text x="432" y="581" class="note">— no confidently misleading pictogram.</text>
  </g>

  <text x="40" y="632" class="note" fill="#8A8A8C">Self-directed concept — not shipped SEB work. No claims are made about SEB’s internal data or systems.</text>
</svg>
