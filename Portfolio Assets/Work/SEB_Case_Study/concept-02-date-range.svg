<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 848" width="390" height="848" role="img" aria-label="SEB concept: a date-range bottom sheet with presets and a custom From/To range, styled as an existing SEB sheet">
  <defs>
    <style>
      text{font-family:-apple-system,'SF Pro Text','Segoe UI','Inter',system-ui,sans-serif;fill:#FFFFFF}
      .sec{fill:#A6A6A8}.ter{fill:#7C7C80}
      .opt{font-size:15px}
    </style>
  </defs>

  <rect width="390" height="848" fill="#0A0A0A"/>

  <!-- dimmed screen behind -->
  <g opacity="0.32">
    <text x="24" y="30" font-size="15" font-weight="600">19:42</text>
    <rect x="16" y="52" width="294" height="40" rx="10" fill="#1E1E20"/>
    <text x="52" y="77" class="sec" font-size="15">Search transactions</text>
    <text x="322" y="77" font-size="15" fill="#3E9FCB">Cancel</text>
    <rect x="16" y="104" width="358" height="36" rx="9" fill="#0A0A0A"/>
    <rect x="16" y="156" width="60" height="32" rx="16" fill="#242427"/>
    <rect x="84" y="156" width="92" height="32" rx="16" fill="#242427"/>
    <rect x="184" y="156" width="84" height="32" rx="16" fill="#242427"/>
  </g>
  <rect width="390" height="848" fill="#000000" opacity="0.35"/>

  <!-- sheet -->
  <path d="M0 300 Q0 280 20 280 H370 Q390 280 390 300 V848 H0 Z" fill="#1C1C1E"/>
  <rect x="175" y="292" width="40" height="5" rx="2.5" fill="#3A3A3C"/>
  <text x="24" y="336" font-size="18" font-weight="600">Date</text>
  <g stroke="#A6A6A8" stroke-width="1.7" stroke-linecap="round"><line x1="350" y1="324" x2="362" y2="336"/><line x1="362" y1="324" x2="350" y2="336"/></g>
  <line x1="0" y1="356" x2="390" y2="356" stroke="#38383A" stroke-width="1"/>

  <!-- preset options (single select) -->
  <g>
    <text x="24" y="389" class="opt">Any time</text>
    <circle cx="360" cy="384" r="9" fill="none" stroke="#4A4A4E" stroke-width="1.6"/>
    <line x1="24" y1="408" x2="366" y2="408" stroke="#38383A" stroke-width="1"/>

    <text x="24" y="437" class="opt">This month</text>
    <circle cx="360" cy="432" r="9" fill="none" stroke="#4A4A4E" stroke-width="1.6"/>
    <line x1="24" y1="456" x2="366" y2="456" stroke="#38383A" stroke-width="1"/>

    <text x="24" y="485" class="opt">Last 3 months</text>
    <circle cx="360" cy="480" r="9" fill="#19516F"/><circle cx="360" cy="480" r="3.3" fill="#FFFFFF"/>
    <line x1="24" y1="504" x2="366" y2="504" stroke="#38383A" stroke-width="1"/>

    <text x="24" y="533" class="opt">Last 12 months</text>
    <circle cx="360" cy="528" r="9" fill="none" stroke="#4A4A4E" stroke-width="1.6"/>
    <line x1="24" y1="552" x2="366" y2="552" stroke="#38383A" stroke-width="1"/>

    <text x="24" y="581" class="opt">2026</text>
    <circle cx="360" cy="576" r="9" fill="none" stroke="#4A4A4E" stroke-width="1.6"/>
    <line x1="24" y1="600" x2="366" y2="600" stroke="#38383A" stroke-width="1"/>

    <text x="24" y="629" class="opt">2025</text>
    <circle cx="360" cy="624" r="9" fill="none" stroke="#4A4A4E" stroke-width="1.6"/>
  </g>

  <!-- custom range -->
  <text x="24" y="678" font-size="12.5" class="sec" letter-spacing="0.4">CUSTOM RANGE</text>
  <g>
    <rect x="24" y="692" width="166" height="46" rx="10" fill="#242427"/>
    <rect x="40" y="708" width="13" height="13" rx="2.5" fill="none" stroke="#A6A6A8" stroke-width="1.5"/>
    <line x1="40" y1="713" x2="53" y2="713" stroke="#A6A6A8" stroke-width="1.5"/>
    <text x="64" y="720" font-size="13.5" class="sec">From</text>

    <rect x="200" y="692" width="166" height="46" rx="10" fill="#242427"/>
    <rect x="216" y="708" width="13" height="13" rx="2.5" fill="none" stroke="#A6A6A8" stroke-width="1.5"/>
    <line x1="216" y1="713" x2="229" y2="713" stroke="#A6A6A8" stroke-width="1.5"/>
    <text x="240" y="720" font-size="13.5" class="sec">To</text>
  </g>

  <!-- actions -->
  <text x="46" y="792" font-size="15" fill="#63B7D9" text-anchor="middle">Clear</text>
  <rect x="126" y="770" width="240" height="46" rx="12" fill="#19516F"/>
  <text x="246" y="799" font-size="15" font-weight="600" fill="#E7F4FA" text-anchor="middle">Apply</text>

  <rect x="139" y="826" width="112" height="5" rx="2.5" fill="#3A3A3C"/>
</svg>
